name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Deliberately disposable CI-only credentials for the isolated service
      # below. Production credentials are never available to this workflow.
      DATABASE_URL: mysql://astrotools_app:astrotools_ci_runtime_password@127.0.0.1:3306/astrotools_test
      MIGRATION_DATABASE_URL: mysql://astrotools_migrate:astrotools_ci_migration_password@127.0.0.1:3306/astrotools_test
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: astrotools_test
          MYSQL_USER: astrotools_migrate
          MYSQL_PASSWORD: astrotools_ci_migration_password
          MYSQL_ROOT_PASSWORD: astrotools_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp -h 127.0.0.1
          -uastrotools_migrate -pastrotools_ci_migration_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Prepare CI database and runtime identity
        run: >-
          docker exec --env MYSQL_PWD=astrotools_ci_root_password "${{
          job.services.mysql.id }}" mysql --protocol=socket --user=root
          --execute="ALTER DATABASE astrotools_test CHARACTER SET utf8mb4
          COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS
          'astrotools_app'@'%' IDENTIFIED BY 'astrotools_ci_runtime_password';
          ALTER USER 'astrotools_app'@'%' IDENTIFIED BY
          'astrotools_ci_runtime_password'; REVOKE ALL PRIVILEGES, GRANT OPTION
          FROM 'astrotools_app'@'%';"

      - name: Apply schema for table-specific grants
        run: npm run db:migrate:deploy

      - name: Grant runtime access to API-readable tables only
        run: >-
          docker exec --env MYSQL_PWD=astrotools_ci_root_password "${{
          job.services.mysql.id }}" mysql --protocol=socket --user=root
          --execute="GRANT SELECT ON astrotools_test.manufacturers TO
          'astrotools_app'@'%'; GRANT SELECT ON astrotools_test.telescopes TO
          'astrotools_app'@'%'; GRANT SELECT ON astrotools_test.cameras TO
          'astrotools_app'@'%'; GRANT SELECT ON
          astrotools_test.optical_modifiers TO 'astrotools_app'@'%'; GRANT
          SELECT ON astrotools_test.astronomical_targets TO
          'astrotools_app'@'%';"

      - name: Audit dependencies
        run: npm run audit:production

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Generate, migrate, seed twice, and run MySQL integration tests
        run: npm run test:integration

      - name: Build standalone application
        run: npm run build

  end-to-end:
    name: End-to-end (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser journey
        run: npm run test:e2e -- --project=${{ matrix.project }}
