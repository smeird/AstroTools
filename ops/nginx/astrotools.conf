# AstroTools public reverse proxy. Node remains private on 127.0.0.1:3100.
server {
    listen 80;
    listen [::]:80;
    server_name astrotools.smeird.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name astrotools.smeird.com;
    ssl_certificate /etc/letsencrypt/live/astrotools.smeird.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrotools.smeird.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'" always;
    location ~ /(?:\.git|\.env|AGENTS\.md|README(?:\.md)?|package(?:-lock)?\.json|next\.config\.(?:js|mjs|ts))$ { deny all; }
    location ~ /\. { deny all; }
    location /_next/static/ { proxy_pass http://127.0.0.1:3100; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
