# Astrotools Apache 2.4 example for Ubuntu 24.04.
#
# Install after reviewing the paths and enabling the required modules:
#   a2enmod ssl proxy proxy_http headers rewrite expires deflate
#   a2ensite astrotools.conf
#   apachectl configtest
#
# Certificate files are managed by Certbot and are intentionally not created
# by this repository. Apache is the only public application endpoint; the
# Next.js service must remain bound to 127.0.0.1:3100.

<VirtualHost *:80>
    ServerName astrotools.smeird.com
    DocumentRoot /var/www/AstroTools/current/public

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://astrotools.smeird.com%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/astrotools-error.log
    CustomLog ${APACHE_LOG_DIR}/astrotools-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName astrotools.smeird.com
    DocumentRoot /var/www/AstroTools/current/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/astrotools.smeird.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/astrotools.smeird.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Keep ACME and the optional maintenance page on Apache. The catch-all
    # proxy below must remain after these exclusions.
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass /maintenance.html !
    ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / http://127.0.0.1:3100/

    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    Alias /maintenance.html /var/www/AstroTools/current/public/maintenance.html
    <Files "maintenance.html">
        Require all granted
    </Files>

    # An operator can install /etc/astrotools/maintenance.conf and create
    # /etc/astrotools/maintenance.enabled for a controlled maintenance page.
    IncludeOptional /etc/astrotools/maintenance.conf

    LimitRequestBody 1048576

    <LocationMatch "^/_next/static/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'"

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/javascript application/json application/wasm image/svg+xml

    # Do not allow accidental exposure of repository metadata, environment
    # files, or hidden files through a future Alias or DocumentRoot change.
    <LocationMatch "^/(?:\.git(?:/|$)|\.env(?:\.|$)|AGENTS\.md$|README(?:\.md)?$|package(?:-lock)?\.json$|next\.config\.(?:js|mjs|ts)$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/(?!\.well-known/acme-challenge/).*\/\.">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/astrotools-error.log
    CustomLog ${APACHE_LOG_DIR}/astrotools-access.log combined
</VirtualHost>
</IfModule>
